<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }
        /* Панель налаштувань з'являється тільки при виборі тексту */
        #mini-tools {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }
        .tool-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        label { font-size: 12px; color: #666; font-family: sans-serif; }
        .save-hint {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="save-hint">Подвійний клік на фоні, щоб зберегти результат</div>

    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>

    <div id="mini-tools">
        <div class="tool-row">
            <input type="text" id="t-text" style="flex-grow: 1;" placeholder="Текст">
        </div>
        <div class="tool-row">
            <div style="display:flex; flex-direction:column; flex:1;">
                <label>Розмір</label>
                <input type="number" id="t-size">
            </div>
            <div style="display:flex; flex-direction:column; width: 60px;">
                <label>Колір</label>
                <input type="color" id="t-color" style="height: 38px; width: 100%; padding: 0;">
            </div>
            <button onclick="canvas.discardActiveObject(); canvas.renderAll();" style="border:none; background:#007AFF; color:white; border-radius:8px; padding:0 15px;">OK</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('main-canvas');
        const tools = document.getElementById('mini-tools');
        
        // Шлях до твого файлу в GitHub
        const bgImage = 'receipt.jpg';

        fabric.Image.fromURL(bgImage, function(img) {
            canvas.setWidth(img.width);
            canvas.setHeight(img.height);
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
            
            // Створюємо поля на тих самих місцях
            addFields();
        });

        function addFields() {
            const f = [
                { t: 'P24A5585215829D8130', x: 800, y: 175, s: 10 },
                { t: 'P24A5585215829D8130', x: 50, y: 240, s: 10 },
                { t: 'ЯЩУК РОМАН МИКОЛАЙОВИЧ', x: 50, y: 288, s: 11 },
                { t: '3962708533', x: 50, y: 320, s: 11 },
                { t: 'UA463052990262096400990356871', x: 50, y: 345, s: 11 },
                { t: 'АТ КБ ПРИВАТБАНК', x: 50, y: 370, s: 11 },
                { t: '-', x: 520, y: 288, s: 11 },
                { t: 'UA232441015262947', x: 520, y: 345, s: 11 },
                { t: 'PJSC BANK ALLIANCE', x: 520, y: 370, s: 11 },
                { t: 'Переказ власних коштів.', x: 50, y: 420, s: 11 },
                { t: '5,00', x: 680, y: 420, s: 11 },
                { t: '320,00', x: 915, y: 420, s: 12 },
                { t: 'триста двадцять грн. 00 коп.', x: 800, y: 445, s: 10 },
                { t: '2026/04/04 21:58   Ящук Роман Миколайович', x: 45, y: 735, s: 10 },
                { t: '04/04/2026 21:58', x: 865, y: 722, s: 10 },
                { t: '04/03/2026', x: 890, y: 748, s: 10 }
            ];

            f.forEach(conf => {
                const text = new fabric.IText(conf.t, {
                    left: conf.x,
                    top: conf.y,
                    fontSize: conf.s,
                    fontFamily: 'Arial',
                    fill: '#000',
                    backgroundColor: '#fff',
                    hasRotatingPoint: false,
                    transparentCorners: true,
                    cornerSize: 7
                });
                canvas.add(text);
            });
        }

        // Логіка панелі налаштувань
        canvas.on('selection:created', updatePanel);
        canvas.on('selection:updated', updatePanel);
        canvas.on('selection:cleared', () => tools.style.display = 'none');

        function updatePanel() {
            const obj = canvas.getActiveObject();
            if (obj && obj.type === 'i-text') {
                tools.style.display = 'block';
                document.getElementById('t-text').value = obj.text;
                document.getElementById('t-size').value = obj.fontSize;
                document.getElementById('t-color').value = obj.fill;
            }
        }

        // Зв'язок інпутів з текстом
        document.getElementById('t-text').oninput = function() {
            const obj = canvas.getActiveObject();
            if(obj) { obj.set('text', this.value); canvas.renderAll(); }
        };
        document.getElementById('t-size').oninput = function() {
            const obj = canvas.getActiveObject();
            if(obj) { obj.set('fontSize', parseInt(this.value)); canvas.renderAll(); }
        };
        document.getElementById('t-color').oninput = function() {
            const obj = canvas.getActiveObject();
            if(obj) { obj.set('fill', this.value); canvas.renderAll(); }
        };

        // Збереження при подвійному кліку на фоні
        canvas.on('mouse:dblclick', function(options) {
            if (!options.target) {
                const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
                const link = document.createElement('a');
                link.download = 'ready_kvit.png';
                link.href = dataURL;
                link.click();
            }
        });
    </script>
</body>
</html>
