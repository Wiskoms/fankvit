<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Receipt Editor Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        @font-face {
            font-family: 'Manrope';
            src: url('Manrope.ttf') format('truetype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Manrope';
            src: url('Manrope-Bold.ttf') format('truetype');
            font-weight: bold;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-wrapper {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            justify-content: center; /* Центрування по горизонталі */
            align-items: flex-start; /* Дозволяє скролити вниз */
            -webkit-overflow-scrolling: touch;
        }

        /* Приховуємо стандартні рамки виділення Fabric.js */
        canvas {
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
    </div>

    <script>
        const canvas = new fabric.Canvas('main-canvas', {
            selection: false,
            allowTouchScrolling: true
        });

        // Налаштування полів (координати, розмір, жирність)
        const fields = [
            { t: 'P24A5585215829D8130', x: 800, y: 175, s: 10, c: '#555', b: false },
            { t: 'P24A5585215829D8130', x: 50, y: 240, s: 10, c: '#555', b: false },
            { t: 'ЯЩУК РОМАН МИКОЛАЙОВИЧ', x: 50, y: 288, s: 13, c: '#000', b: true },
            { t: '3962708533', x: 50, y: 320, s: 12, c: '#000', b: false },
            { t: 'UA463052990262096400990356871', x: 50, y: 345, s: 11, c: '#000', b: false },
            { t: 'АТ КБ ПРИВАТБАНК', x: 50, y: 370, s: 11, c: '#000', b: false },
            { t: 'UA232441015262947', x: 520, y: 345, s: 11, c: '#000', b: false },
            { t: 'PJSC BANK ALLIANCE', x: 520, y: 370, s: 11, c: '#000', b: false },
            { t: 'Переказ власних коштів.', x: 50, y: 420, s: 12, c: '#000', b: false },
            { t: '5,00', x: 685, y: 420, s: 12, c: '#000', b: false },
            { t: '320,00', x: 920, y: 420, s: 13, c: '#000', b: true },
            { t: 'триста двадцять грн. 00 коп.', x: 805, y: 445, s: 10, c: '#000', b: false },
            { t: '2026/04/04 21:58   Ящук Роман Миколайович', x: 45, y: 735, s: 10, c: '#333', b: false },
            { t: '04/04/2026 21:58', x: 865, y: 722, s: 10, c: '#333', b: false },
            { t: '04/03/2026', x: 890, y: 748, s: 10, c: '#333', b: false }
        ];

        fabric.Image.fromURL('receipt.jpg', function(img) {
            canvas.setWidth(img.width);
            canvas.setHeight(img.height);
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
            
            fields.forEach(conf => {
                const iText = new fabric.IText(conf.t, {
                    left: conf.x,
                    top: conf.y,
                    fontSize: conf.s,
                    fill: conf.c,
                    fontFamily: 'Manrope',
                    fontWeight: conf.b ? 'bold' : 'normal',
                    backgroundColor: '#fff',
                    
                    // Блокування рухів
                    lockMovementX: true,
                    lockMovementY: true,
                    lockScalingX: true,
                    lockScalingY: true,
                    lockRotation: true,
                    
                    // Налаштування курсору
                    cursorColor: '#28a745',
                    selectionBackgroundColor: 'rgba(40, 167, 69, 0.2)',
                    
                    hasControls: false,
                    hasBorders: false,
                    editingBorderColor: 'transparent'
                });

                canvas.add(iText);
            });
        });

        // Скачування при подвійному кліку на пустому фоні
        canvas.on('mouse:dblclick', function(opt) {
            if (!opt.target) {
                const link = document.createElement('a');
                link.download = 'result.png';
                link.href = canvas.toDataURL({ format: 'png', multiplier: 2 });
                link.click();
            }
        });

        // Вимикаємо стандартне меню браузера при довгому натисканні на телефоні
        window.oncontextmenu = function(event) {
             event.preventDefault();
             event.stopPropagation();
             return false;
        };
    </script>
</body>
</html>
