<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receipt Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Roboto', sans-serif; }
        #canvas-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Поле введення тексту знизу */
        #edit-panel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .btn-done {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>

    <div id="edit-panel">
        <input type="text" id="text-input" placeholder="Введіть текст...">
        <button class="btn-done" onclick="closeEditor()">Готово</button>
    </div>

    <script>
        const canvas = new fabric.Canvas('main-canvas', { selection: false });
        const editPanel = document.getElementById('edit-panel');
        const textInput = document.getElementById('text-input');
        let activeObj = null;

        // --- НАЛАШТУВАННЯ ПОЛІВ (Змінюй тут розмір, колір та позицію) ---
        const fieldsConfig = [
            { text: 'P24A5585215829D8130', x: 800, y: 175, size: 10, color: '#555' },
            { text: 'P24A5585215829D8130', x: 50, y: 240, size: 10, color: '#555' },
            { text: 'ЯЩУК РОМАН МИКОЛАЙОВИЧ', x: 50, y: 288, size: 13, color: '#000' },
            { text: '3962708533', x: 50, y: 320, size: 12, color: '#000' },
            { text: 'UA463052990262096400990356871', x: 50, y: 345, size: 11, color: '#000' },
            { text: 'АТ КБ ПРИВАТБАНК', x: 50, y: 370, size: 11, color: '#000' },
            { text: 'UA232441015262947', x: 520, y: 345, size: 11, color: '#000' },
            { text: 'PJSC BANK ALLIANCE', x: 520, y: 370, size: 11, color: '#000' },
            { text: 'Переказ власних коштів.', x: 50, y: 420, size: 12, color: '#000' },
            { text: '5,00', x: 685, y: 420, size: 12, color: '#000' },
            { text: '320,00', x: 920, y: 420, size: 13, color: '#000' },
            { text: 'триста двадцять грн. 00 коп.', x: 805, y: 445, size: 10, color: '#000' },
            { text: '2026/04/04 21:58   Ящук Роман Миколайович', x: 45, y: 735, size: 10, color: '#333' },
            { text: '04/04/2026 21:58', x: 865, y: 722, size: 10, color: '#333' },
            { text: '04/04/2026 21:58', x: 865, y: 735, size: 10, color: '#333' },
            { text: '04/03/2026', x: 890, y: 748, size: 10, color: '#333' }
        ];

        // Завантаження фону
        fabric.Image.fromURL('receipt.jpg', function(img) {
            canvas.setWidth(img.width);
            canvas.setHeight(img.height);
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
            
            // Додаємо поля
            fieldsConfig.forEach(conf => {
                const t = new fabric.Text(conf.text, {
                    left: conf.x,
                    top: conf.y,
                    fontSize: conf.size,
                    fill: conf.color,
                    fontFamily: 'Roboto',
                    backgroundColor: '#fff',
                    selectable: true,
                    hasControls: false, // Забороняємо змінювати розмір пальцями
                    hasBorders: false
                });
                canvas.add(t);
            });
        });

        // Відкриття редактора при натисканні на текст
        canvas.on('selection:created', (e) => openEditor(e.target));
        canvas.on('mousedown', (e) => {
            if (e.target && e.target.type === 'text') openEditor(e.target);
        });

        function openEditor(obj) {
            activeObj = obj;
            textInput.value = obj.text;
            editPanel.style.display = 'block';
            textInput.focus();
        }

        function closeEditor() {
            if (activeObj) {
                activeObj.set('text', textInput.value);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
            editPanel.style.display = 'none';
        }

        // Оновлення тексту в реальному часі
        textInput.oninput = function() {
            if (activeObj) {
                activeObj.set('text', this.value);
                canvas.renderAll();
            }
        };

        // Подвійний клік на порожньому місці — скачати результат
        canvas.on('mouse:dblclick', function(opt) {
            if (!opt.target) {
                const link = document.createElement('a');
                link.download = 'kvit_ready.png';
                link.href = canvas.toDataURL({ format: 'png' });
                link.click();
            }
        });
    </script>
</body>
</html>
