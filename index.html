<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bank Editor</title>
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; font-family: 'Manrope', sans-serif; position: fixed; touch-action: none; }
        #wrapper { width: 100vw; height: 100vh; display: flex; justify-content: center; background-color: #1a1a1a; overflow: hidden; }
        .receipt-container { position: relative; background-size: 100% 100%; background-repeat: no-repeat; width: 100%; overflow-y: auto; }
        .editable { position: absolute; background: transparent; outline: none; white-space: nowrap; display: inline-block; color: #000; text-shadow: 0.1px 0.1px 0px rgba(255,255,255,0.1); }
        .bold { font-family: 'Manrope-Bold', sans-serif !important; font-weight: bold; }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="receipt" class="receipt-container" spellcheck="false"></div>
    </div>
    <script>
        const fieldsConfig = [
            { id: 'f1',  t: 'P24A9910442750C2031', left: 78.2, top: 16.95, s: 1.4, rightAlign: true, b: true },
            { id: 'f2',  t: 'P24A9910442750C2031', left: 3.97,  top: 23.84,  s: 1.4 },
            { id: 'f3',  t: 'КОВАЛЕНКО ДМИТРО ІГОРОВИЧ', left: 3.97,  top: 28.54,  s: 1.4 },
            { id: 'f18', t: 'КОВАЛЕНКО ДМИТРО ІГОРОВИЧ', left: 51.6,  top: 28.54,  s: 1.4 },
            { id: 'f4',  t: '3821094756', left: 3.97,  top: 31.64,  s: 1.4 },
            { id: 'f17', t: '3821094756', left: 51.6,  top: 31.64,  s: 1.4 },
            { id: 'f5',  t: 'UA553226690000026004558210344', left: 3.97, top: 34.2, s: 1.4 },
            { id: 'f6',  t: 'АТ КБ ПРИВАТБАНК', left: 3.97 , top: 36.72, s: 1.4 },
            { id: 'f7',  t: 'UA113005280000026209947103255', left: 51.6, top: 34.2, s: 1.4 },
            { id: 'f8',  t: 'АТ РАЙФФАЙЗЕН БАНК', left: 51.6, top: 36.72, s: 1.4 },
            { id: 'f9',  t: 'Поповнення рахунку.', left: 3.97, top: 41.7, s: 1.4 },
            { id: 'f10', t: '2,00', left: 67.65, top: 41.73, s: 1.5 },
            { id: 'f11', t: '560,00', left: 90.89, top: 41.73, s: 1.5 },
            { id: 'f12', t: 'п’ятсот шістдесят грн. 00 коп.', left: 78.53, top: 44.35, s: 1.3 },
            { id: 'f13', t: '2026/04/14 16:45   Коваленко Дмитро Ігорович', left: 3.97, top: 72.96, s: 1.15 },
            { id: 'f14', t: '14/04/2026 16:45', left: 85.89, top: 71.87, s: 1.15 },
            { id: 'f16', t: '14/04/2026 16:45', left: 85.89, top: 72.95, s: 1.15 },
            { id: 'f15', t: '14/04/2026', left: 89.17, top: 74.02, s: 1.15 }
        ];

        const container = document.getElementById('receipt');

        function init() {
            const img = new Image();
            img.src = 'receipt.jpg';
            img.onload = function() {
                container.style.height = (window.innerWidth * (img.height / img.width)) + 'px';
                container.style.backgroundImage = "url('receipt.jpg')";
                renderFields();
                loadSaved();
            };
            img.onerror = function() { alert("Помилка: Файл receipt.jpg не знайдено!"); };
        }

        function renderFields() {
            fieldsConfig.forEach(conf => {
                const el = document.createElement('div');
                el.id = conf.id;
                el.className = 'editable' + (conf.b ? ' bold' : '');
                el.contentEditable = "true";
                el.style.top = conf.top + '%';
                if (conf.rightAlign) { el.style.right = (100 - conf.left) + '%'; el.style.textAlign = 'right'; }
                else { el.style.left = conf.left + '%'; }
                el.style.fontSize = conf.s + 'vw';
                el.innerText = conf.t;
                el.oninput = saveAll;
                container.appendChild(el);
            });
        }

        function saveAll() {
            const data = {};
            document.querySelectorAll('.editable').forEach(el => data[el.id] = el.innerText);
            localStorage.setItem('receipt_final_v10', JSON.stringify(data));
        }

        function loadSaved() {
            const saved = localStorage.getItem('receipt_final_v10');
            if (saved) {
                const data = JSON.parse(saved);
                for (let id in data) { if (document.getElementById(id)) document.getElementById(id).innerText = data[id]; }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
