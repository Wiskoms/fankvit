<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Receipt Editor Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        @font-face {
            font-family: 'Manrope';
            src: url('Manrope.ttf') format('truetype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'Manrope';
            src: url('Manrope-Bold.ttf') format('truetype');
            font-weight: bold;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #000; 
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden; /* Запобігає смиканню екрана */
        }

        #canvas-wrapper {
            width: 100vw;
            height: 100vh;
            overflow: auto; /* Дозволяє скролити великий чек вниз */
            display: flex;
            justify-content: center;
            background-color: #1a1a1a;
            -webkit-overflow-scrolling: touch;
        }

        canvas {
            display: block;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Прибираємо підсвітку при натисканні на телефоні */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
    </div>

    <script>
        const canvas = new fabric.Canvas('main-canvas', {
            selection: false,
            allowTouchScrolling: true,
            containerClass: 'mobile-canvas'
        });

        // Твої координати (пиши їх сюди як для ОРИГІНАЛЬНОГО великого фото)
        const fieldsConfig = [
            { t: 'P24A5585215829D8130', x: 800, y: 175, s: 10, c: '#555', b: false },
            { t: 'P24A5585215829D8130', x: 50, y: 240, s: 10, c: '#555', b: false },
            { t: 'ЯЩУК РОМАН МИКОЛАЙОВИЧ', x: 50, y: 288, s: 13, c: '#000', b: true },
            { t: '3962708533', x: 50, y: 320, s: 12, c: '#000', b: false },
            { t: 'UA463052990262096400990356871', x: 50, y: 345, s: 11, c: '#000', b: false },
            { t: 'АТ КБ ПРИВАТБАНК', x: 50, y: 370, s: 11, c: '#000', b: false },
            { t: 'UA232441015262947', x: 520, y: 345, s: 11, c: '#000', b: false },
            { t: 'PJSC BANK ALLIANCE', x: 520, y: 370, s: 11, c: '#000', b: false },
            { t: 'Переказ власних коштів.', x: 50, y: 420, s: 12, c: '#000', b: false },
            { t: '5,00', x: 685, y: 420, s: 12, c: '#000', b: false },
            { t: '320,00', x: 920, y: 420, s: 13, c: '#000', b: true },
            { t: 'триста двадцять грн. 00 коп.', x: 805, y: 445, s: 10, c: '#000', b: false },
            { t: '2026/04/04 21:58   Ящук Роман Миколайович', x: 45, y: 735, s: 10, c: '#333', b: false },
            { t: '04/04/2026 21:58', x: 865, y: 722, s: 10, c: '#333', b: false },
            { t: '04/03/2026', x: 890, y: 748, s: 10, c: '#333', b: false }
        ];

        fabric.Image.fromURL('receipt.jpg', function(img) {
            // РОЗРАХУНОК МАСШТАБУ ПІД ТЕЛЕФОН
            const screenWidth = window.innerWidth;
            const scale = screenWidth / img.width;

            canvas.setWidth(img.width * scale);
            canvas.setHeight(img.height * scale);
            
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                scaleX: scale,
                scaleY: scale
            });
            
            fieldsConfig.forEach(conf => {
                const iText = new fabric.IText(conf.t, {
                    left: conf.x * scale,   // Масштабуємо позицію X
                    top: conf.y * scale,    // Масштабуємо позицію Y
                    fontSize: conf.s * scale, // Масштабуємо розмір тексту
                    fill: conf.c,
                    fontFamily: 'Manrope',
                    fontWeight: conf.b ? 'bold' : 'normal',
                    backgroundColor: '#fff',
                    
                    // Фіксуємо поле
                    lockMovementX: true,
                    lockMovementY: true,
                    lockScalingX: true,
                    lockScalingY: true,
                    lockRotation: true,
                    
                    hasControls: false,
                    hasBorders: false,
                    editingBorderColor: 'transparent',
                    cursorColor: '#28a745'
                });

                canvas.add(iText);
            });
        });

        // Збереження (Подвійний клік на фоні)
        canvas.on('mouse:dblclick', function(opt) {
            if (!opt.target) {
                const link = document.createElement('a');
                link.download = 'edited_receipt.png';
                // Використовуємо multiplier: 1/scale, щоб скачати в оригінальній якості (велике фото)
                const originalWidth = canvas.backgroundImage.width;
                const multiplier = originalWidth / canvas.width;
                
                link.href = canvas.toDataURL({ 
                    format: 'png', 
                    multiplier: multiplier 
                });
                link.click();
            }
        });

        // Запобігаємо виклику меню при довгому тапі
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
