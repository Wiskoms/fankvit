<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bank Editor">
    
    <link rel="apple-touch-icon" href="icon.png">

    <title>Bank Editor Final</title>
    
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Manrope', sans-serif;
            /* Запобігає випадковим рухам сторінки в режимі додатка */
            position: fixed; 
            touch-action: none;
        }

        #wrapper {
            width: 100vw; height: 100vh;
            overflow: hidden; /* Вимикаємо прокрутку всього екрана */
            display: flex;
            justify-content: center; background-color: #1a1a1a;
        }

        .receipt-container {
            position: relative;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            width: 100%;
            /* Дозволяємо прокрутку тільки самої квитанції, якщо вона не влізає */
            overflow-y: auto;
        }

        .editable {
            position: absolute;
            background: transparent; 
            outline: none;
            white-space: nowrap;
            display: inline-block;
            min-width: 5px;
            cursor: text;
            color: #000;
            font-weight: normal;
            text-shadow: 0.1px 0.1px 0px rgba(255,255,255,0.1);
        }

        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="receipt" class="receipt-container" spellcheck="false"></div>
    </div>

    <script>
        const fieldsConfig = [
            { id: 'f1',  t: 'P24A9910442750C2031', left: 78.2, top: 16.94, s: 1.4 },
            { id: 'f2',  t: 'P24A9910442750C2031', left: 3.97,  top: 23.84,  s: 1.4 },
            { id: 'f3',  t: 'КОВАЛЕНКО ДМИТРО ІГОРОВИЧ', left: 3.97,  top: 28.54,  s: 1.4 },
            { id: 'f18',  t: 'КОВАЛЕНКО ДМИТРО ІГОРОВИЧ', left: 51.6,  top: 28.54,  s: 1.4 },
            { id: 'f4',  t: '3821094756', left: 3.97,  top: 31.64,  s: 1.4 },
            { id: 'f17',  t: '3821094756', left: 51.6,  top: 31.64,  s: 1.4 },
            { id: 'f5',  t: 'UA553226690000026004558210344', left: 3.97, top: 34.2, s: 1.4 },
            { id: 'f6',  t: 'АТ КБ ПРИВАТБАНК', left: 3.97 , top: 36.72, s: 1.4 },
            { id: 'f7',  t: 'UA113005280000026209947103255', left: 51.6, top: 34.2, s: 1.4 },
            { id: 'f8',  t: 'АТ РАЙФФАЙЗЕН БАНК', left: 51.6, top: 36.72, s: 1.4 },
            { id: 'f9',  t: 'Поповнення рахунку.', left: 3.97, top: 41.7, s: 1.4 },
            { id: 'f10', t: '2,00', left: 67.65, top: 41.73, s: 1.5 },
            { id: 'f11', t: '560,00', left: 90.89, top: 41.73, s: 1.5 },
            { id: 'f12', t: 'п’ятсот шістдесят грн. 00 коп.', left: 78.53, top: 44.35, s: 1.3 },
            { id: 'f13', t: '2026/04/14 16:45   Коваленко Дмитро Ігорович', left: 3.97, top: 72.96, s: 1.15 },
            { id: 'f14', t: '14/04/2026 16:45', left: 85.89, top: 71.87, s: 1.15 },
            { id: 'f16', t: '14/04/2026 16:45', left: 85.89, top: 72.95, s: 1.15 },
            { id: 'f15', t: '14/04/2026', left: 89.17, top: 74.02, s: 1.15 }
        ];

        const container = document.getElementById('receipt');

        function init() {
            const img = new Image();
            img.src = 'receipt.jpg';
            img.onload = function() {
                const ratio = img.height / img.width;
                container.style.height = (window.innerWidth * ratio) + 'px';
                container.style.backgroundImage = "url('receipt.jpg')";
                loadData();
            };
        }

        function renderFields() {
            fieldsConfig.forEach(conf => {
                const el = document.createElement('div');
                el.id = conf.id;
                el.className = 'editable';
                el.contentEditable = "true";
                el.style.top = conf.top + '%';
                
                if (conf.rightAlign) {
                    el.style.right = (100 - conf.left) + '%';
                    el.style.textAlign = 'right';
                } else {
                    el.style.left = conf.left + '%';
                }

                el.style.fontSize = conf.s + 'vw';
                el.innerText = conf.t;
                el.addEventListener('input', saveData);
                container.appendChild(el);
            });
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('.editable').forEach(el => {
                data[el.id] = el.innerText;
            });
            localStorage.setItem('receipt_final_save', JSON.stringify(data));
        }

        function loadData() {
            renderFields();
            const saved = localStorage.getItem('receipt_final_save');
            if (saved) {
                const data = JSON.parse(saved);
                for (let id in data) {
                    const el = document.getElementById(id);
                    if (el) el.innerText = data[id];
                }
            }
        }

        window.addEventListener('load', init);
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
