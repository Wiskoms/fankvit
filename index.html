<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bank Editor - Thin Style</title>
    
    <style>
        /* Підвантажуємо обидва шрифти: звичайний та жирний */
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Manrope', sans-serif; /* Основний тонкий шрифт */
        }

        #wrapper {
            width: 100vw; height: 100vh;
            overflow-y: auto; display: flex;
            justify-content: center; background-color: #1a1a1a;
            -webkit-overflow-scrolling: touch;
        }

        .receipt-container {
            position: relative;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            width: 100%;
        }

        .editable {
            position: absolute;
            background: transparent; 
            outline: none;
            white-space: nowrap;
            display: inline-block;
            min-width: 5px;
            cursor: text;
            /* Тінь мінімальна, щоб не товстила шрифт */
            text-shadow: 0.2px 0.2px 0px rgba(255,255,255,0.2);
        }

        /* Клас для жирного тексту, де це потрібно */
        .bold { font-family: 'Manrope-Bold', sans-serif; }

        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="receipt" class="receipt-container" spellcheck="false"></div>
    </div>

    <script>
        // Рандомні дані + тонкий шрифт + сірий колір (#6a6a6a)
        const fieldsConfig = [
            { id: 'f1',  t: 'P24A9910442750C2031', left: 78.2, top: 16.94, s: 1.5, c: '#000', b: false },
            { id: 'f2',  t: 'P24A9910442750C2031', left: 3.9,  top: 23.0, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f3',  t: 'КОВАЛЕНКО ДМИТРО ІГОРОВИЧ', left: 3.9,  top: 28.6, s: 1.5, c: '#000', b: false },
            { id: 'f4',  t: '3821094756', left: 3.9,  top: 32.0, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f5',  t: 'UA553226690000026004558210344', left: 3.95, top: 34.6, s: 1.4, c: '#6a6a6a', b: false },
            { id: 'f6',  t: 'АТ КБ ПРИВАТБАНК', left: 4.0, top: 36.75, s: 1.4, c: '#6a6a6a', b: false },
            { id: 'f7',  t: 'UA113005280000026209947103255', left: 52.0, top: 34.5, s: 1.4, c: '#6a6a6a', b: false },
            { id: 'f8',  t: 'АТ РАЙФФАЙЗЕН БАНК', left: 52.0, top: 37.0, s: 1.4, c: '#6a6a6a', b: false },
            { id: 'f9',  t: 'Поповнення рахунку.', left: 3.9, top: 41.7, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f10', t: '2,00', left: 68.5, top: 42.0, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f11', t: '560,00', left: 92.2, top: 42.0, s: 1.6, c: '#000', b: true, rightAlign: true },
            { id: 'f12', t: 'п’ятсот шістдесят грн. 00 коп.', left: 80.5, top: 44.5, s: 1.3, c: '#6a6a6a', b: false },
            { id: 'f13', t: '2026/04/11 16:45   Коваленко Дмитро Ігорович', left: 4.6, top: 73.5, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f14', t: '11/04/2026 16:45', left: 87.2, top: 72.2, s: 1.5, c: '#6a6a6a', b: false },
            { id: 'f15', t: '11/04/2026', left: 89.5, top: 74.8, s: 1.5, c: '#6a6a6a', b: false }
        ];

        const container = document.getElementById('receipt');

        function init() {
            const img = new Image();
            img.src = 'receipt.jpg';
            img.onload = function() {
                const ratio = img.height / img.width;
                container.style.height = (window.innerWidth * ratio) + 'px';
                container.style.backgroundImage = "url('receipt.jpg')";
                loadData();
            };
        }

        function renderFields() {
            fieldsConfig.forEach(conf => {
                const el = document.createElement('div');
                el.id = conf.id;
                el.className = 'editable' + (conf.b ? ' bold' : '');
                el.contentEditable = "true";
                el.style.top = conf.top + '%';
                
                if (conf.rightAlign) {
                    el.style.right = (100 - conf.left) + '%';
                    el.style.textAlign = 'right';
                } else {
                    el.style.left = conf.left + '%';
                }

                el.style.fontSize = conf.s + 'vw';
                el.style.color = conf.c;
                el.innerText = conf.t;
                el.addEventListener('input', saveData);
                container.appendChild(el);
            });
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('.editable').forEach(el => {
                data[el.id] = el.innerText;
            });
            // Новий ключ v4 для перезапису пам'яті
            localStorage.setItem('receipt_save_v4', JSON.stringify(data));
        }

        function loadData() {
            renderFields();
            const saved = localStorage.getItem('receipt_save_v4');
            if (saved) {
                const data = JSON.parse(saved);
                for (let id in data) {
                    const el = document.getElementById(id);
                    if (el) el.innerText = data[id];
                }
            }
        }

        window.addEventListener('load', init);
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
