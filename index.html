<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bank Editor</title>
    
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: black; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        #wrapper {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            background-color: #1a1a1a;
            -webkit-overflow-scrolling: touch;
        }

        .receipt-container {
            position: relative;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            width: 100%;
        }

        .editable {
            position: absolute;
            border: none;
            background: white; /* Затирає старий текст на фото */
            outline: none;
            white-space: nowrap;
            display: inline-block;
            min-width: 5px;
            cursor: text;
        }

        .bold { font-family: 'Manrope-Bold', sans-serif; font-weight: bold; }

        /* Приховуємо підсвітку на телефонах */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="receipt" class="receipt-container" spellcheck="false">
            </div>
    </div>

    <script>
        // Твоя форма редагування: left, top, font-size (s), color (c), bold (b)
        const fieldsConfig = [
            { id: 'f1',  t: 'P24A5585215829D8130', left: 81.2, top: 19.5, s: 2.1, c: '#555', b: false },
            { id: 'f2',  t: 'P24A5585215829D8130', left: 5.1,  top: 24.0, s: 2.1, c: '#555', b: false },
            { id: 'f3',  t: 'КОВАЛЬ ВАДИМ ОЛЕКСАНДР', left: 5.1,  top: 28.8, s: 1.5, c: '#000', b: true },
            { id: 'f4',  t: '3962708533', left: 5.1,  top: 32.0, s: 1.5, c: '#000', b: false },
            { id: 'f5',  t: 'UA233052990262097400990356871', left: 5.1, top: 34.5, s: 1.5, c: '#000', b: false },
            { id: 'f6',  t: 'АТ КБ ПРИВАТБАНК', left: 5.1, top: 37.0, s: 1.5, c: '#000', b: false },
            { id: 'f7',  t: 'UA232441015262947', left: 52.0, top: 34.5, s: 1.5, c: '#000', b: false },
            { id: 'f8',  t: 'PJSC BANK ALLIANCE', left: 52.0, top: 37.0, s: 1.5, c: '#000', b: false },
            { id: 'f9',  t: 'Переказ власних коштів.', left: 5.1, top: 42.0, s: 1.5, c: '#000', b: false },
            { id: 'f10', t: '5,00', left: 68.5, top: 42.0, s: 1.5, c: '#000', b: false },
            { id: 'f11', t: '320,00', left: 92.2, top: 42.0, s: 1.5, c: '#000', b: true, rightAlign: true },
            { id: 'f12', t: 'триста двадцять грн. 00 коп.', left: 80.5, top: 44.5, s: 1.5, c: '#000', b: false },
            { id: 'f13', t: '2026/04/04 21:58   Ящук Роман Миколайович', left: 4.6, top: 73.5, s: 1.5, c: '#333', b: false },
            { id: 'f14', t: '04/04/2026 21:58', left: 87.2, top: 72.2, s: 1.5, c: '#333', b: false },
            { id: 'f14', t: '04/04/2026 21:58', left: 87.2, top: 73.2, s: 1.5, c: '#333', b: false },
            { id: 'f15', t: '04/03/2026', left: 89.5, top: 74.8, s: 1.5, c: '#333', b: false }
        ];

        const container = document.getElementById('receipt');

        function init() {
            const img = new Image();
            img.src = 'receipt.jpg';
            img.onload = function() {
                const ratio = img.height / img.width;
                container.style.height = (window.innerWidth * ratio) + 'px';
                container.style.backgroundImage = "url('receipt.jpg')";
                loadData();
            };
        }

        function renderFields() {
            fieldsConfig.forEach(conf => {
                const el = document.createElement('div');
                el.id = conf.id;
                el.className = 'editable' + (conf.b ? ' bold' : '');
                el.contentEditable = "true";
                
                // Ті самі стилі: left, top, font-size, color
                el.style.top = conf.top + '%';
                
                if (conf.rightAlign) {
                    el.style.right = (100 - conf.left) + '%';
                    el.style.textAlign = 'right';
                } else {
                    el.style.left = conf.left + '%';
                }

                el.style.fontSize = conf.s + 'vw';
                el.style.color = conf.c;
                el.innerText = conf.t;

                el.addEventListener('input', saveData);
                container.appendChild(el);
            });
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('.editable').forEach(el => {
                data[el.id] = el.innerText;
            });
            localStorage.setItem('receipt_save_data', JSON.stringify(data));
        }

        function loadData() {
            renderFields();
            const saved = localStorage.getItem('receipt_save_data');
            if (saved) {
                const data = JSON.parse(saved);
                for (let id in data) {
                    const el = document.getElementById(id);
                    if (el) el.innerText = data[id];
                }
            }
        }

        window.addEventListener('load', init);
        // Блокуємо контекстне меню
        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
